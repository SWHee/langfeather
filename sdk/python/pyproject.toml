[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langfeather"
version = "0.3.1"
description = "Lightweight local-first tracing SDK for Python LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SungjinWi99" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SungjinWi99/LangFeather"
Documentation = "https://github.com/SungjinWi99/LangFeather#readme"
Source = "https://github.com/SungjinWi99/LangFeather"
Issues = "https://github.com/SungjinWi99/LangFeather/issues"

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langfeather"]

[tool.hatch.build.targets.sdist]
include = ["src/langfeather", "docs", "README.md", "README_EN.md", "LICENSE"]
