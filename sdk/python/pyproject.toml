[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langfeather"
version = "0.1.0"
description = "Lightweight local-first tracing SDK for Python LLM applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langfeather"]
