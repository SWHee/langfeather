<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>LangFeather · Settings</title>
    <style>
      :root {
        --page: #f7f8fa;
        --surface: #fff;
        --line: #e3e8ee;
        --strong: #cfd7e1;
        --ink: #1e2938;
        --muted: #6d7b8d;
        --quiet: #98a4b3;
        --navy: #264a7d;
        --blue: #e8f0fb;
        --red: #bd4038;
        --sans:
          Inter, Pretendard, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--page);
        color: var(--ink);
        font: 14px/1.45 var(--sans);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--navy);
        outline-offset: 2px;
      }
      .topbar {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        font-weight: 760;
        text-decoration: none;
      }
      .mark {
        width: 19px;
        height: 19px;
        border-radius: 5px;
        background: var(--navy);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav a {
        flex: 0 0 auto;
        padding: 8px 10px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 13px;
        text-decoration: none;
        white-space: nowrap;
      }
      .nav a.active {
        background: var(--blue);
        color: var(--navy);
        font-weight: 700;
      }
      .spacer {
        flex: 1;
      }
      .local {
        padding: 4px 8px;
        border: 1px solid var(--strong);
        border-radius: 5px;
        color: var(--muted);
        font: 11px var(--mono);
      }
      .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 34px 28px 52px;
      }
      .eyebrow {
        margin: 0 0 4px;
        color: var(--quiet);
        font: 11px var(--mono);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.035em;
      }
      .sub {
        margin: 5px 0 28px;
        color: var(--muted);
        font-size: 13px;
      }
      .section {
        margin-top: 20px;
      }
      .section h2 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .card + .card {
        margin-top: 10px;
      }
      .card h3 {
        margin: 0;
        font-size: 14px;
      }
      .card p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .btn {
        min-height: 33px;
        padding: 0 11px;
        border: 1px solid var(--strong);
        border-radius: 5px;
        background: #fff;
        color: #36465a;
        font-size: 12px;
        white-space: nowrap;
      }
      .btn.primary {
        border-color: var(--navy);
        background: var(--navy);
        color: #fff;
        font-weight: 700;
      }
      .btn.danger {
        border-color: #d99b97;
        background: #fff;
        color: var(--red);
      }
      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .reset-card {
        display: block;
      }
      .reset-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .reset-form {
        display: flex;
        align-items: end;
        gap: 8px;
        margin-top: 16px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
      }
      .field {
        flex: 1;
      }
      .field label {
        display: block;
        margin-bottom: 5px;
        color: var(--quiet);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .field input {
        width: 100%;
        height: 34px;
        padding: 0 9px;
        border: 1px solid var(--strong);
        border-radius: 5px;
        background: #fff;
        color: var(--ink);
        font: 12px var(--mono);
      }
      .status {
        min-height: 17px;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 11px;
      }
      .status.ok {
        color: #197861;
      }
      .dialog {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(21, 34, 51, 0.2);
      }
      .dialog[hidden] {
        display: none;
      }
      .modal {
        width: min(410px, 100%);
        padding: 18px;
        border: 1px solid var(--strong);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(20, 35, 55, 0.18);
      }
      .modal h2 {
        margin: 0 0 7px;
        font-size: 16px;
      }
      .modal p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
        margin-top: 16px;
      }
      @media (max-width: 640px) {
        .topbar {
          padding: 0 16px;
          gap: 14px;
        }
        .local {
          display: none;
        }
        .page {
          padding: 25px 16px;
        }
        .card,
        .reset-head {
          align-items: flex-start;
          flex-direction: column;
        }
        .reset-form {
          align-items: stretch;
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="claude-modular-observatory-light.html"
        ><span class="mark"></span>LangFeather</a
      >
      <nav class="nav" aria-label="주요 영역">
        <a href="claude-modular-observatory-light.html">Overview</a
        ><a href="claude-traces-workspace-light.html">Traces</a
        ><a href="claude-annotation-queues-light.html">Annotation Queues</a
        ><a href="claude-scores-light.html">Scores</a
        ><a href="claude-evaluation-light.html">Evaluation</a
        ><a class="active" href="claude-settings-light.html">Setting</a>
      </nav>
      <span class="spacer"></span><span class="local">local</span>
    </header>
    <main class="page">
      <p class="eyebrow">LOCAL DATA</p>
      <h1>설정</h1>
      <p class="sub">로컬 SQLite 데이터 관리</p>
      <section class="section" aria-labelledby="backupTitle">
        <h2 id="backupTitle">백업</h2>
        <article class="card">
          <div>
            <h3>SQLite 백업</h3>
            <p>현재 데이터베이스를 다운로드합니다.</p>
          </div>
          <button class="btn primary" id="downloadBackup" type="button">
            백업 다운로드
          </button>
        </article>
        <p class="status" id="backupStatus" role="status"></p>
      </section>
      <section class="section" aria-labelledby="resetTitle">
        <h2 id="resetTitle">초기화</h2>
        <article class="card reset-card">
          <div class="reset-head">
            <div>
              <h3>로컬 데이터 초기화</h3>
              <p>
                모든 traces, observations, annotations, queues, scores와
                datasets가 삭제됩니다.
              </p>
            </div>
          </div>
          <div class="reset-form">
            <div class="field">
              <label for="resetInput">계속하려면 RESET 입력</label
              ><input
                id="resetInput"
                autocomplete="off"
                spellcheck="false"
                placeholder="RESET"
              />
            </div>
            <button class="btn danger" id="startReset" type="button" disabled>
              초기화
            </button>
          </div>
          <p class="status" id="resetStatus" role="status"></p>
        </article>
      </section>
    </main>
    <div
      class="dialog"
      id="resetDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resetDialogTitle"
      hidden
    >
      <div class="modal">
        <h2 id="resetDialogTitle">로컬 데이터를 초기화할까요?</h2>
        <p>
          이 작업은 되돌릴 수 없습니다. 초기화 후 빈 Trace 목록으로 이동합니다.
        </p>
        <div class="modal-actions">
          <button class="btn" id="cancelReset" type="button">취소</button
          ><button class="btn danger" id="confirmReset" type="button">
            초기화
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var backup = document.getElementById("downloadBackup"),
          backupStatus = document.getElementById("backupStatus"),
          resetInput = document.getElementById("resetInput"),
          startReset = document.getElementById("startReset"),
          resetDialog = document.getElementById("resetDialog"),
          resetStatus = document.getElementById("resetStatus");
        backup.addEventListener("click", function () {
          backup.disabled = true;
          backupStatus.textContent = "데모: SQLite 백업 다운로드 요청됨";
          backupStatus.className = "status ok";
          setTimeout(function () {
            backup.disabled = false;
          }, 700);
        });
        resetInput.addEventListener("input", function () {
          startReset.disabled = resetInput.value !== "RESET";
        });
        startReset.addEventListener("click", function () {
          resetDialog.hidden = false;
          document.getElementById("cancelReset").focus();
        });
        document
          .getElementById("cancelReset")
          .addEventListener("click", function () {
            resetDialog.hidden = true;
            startReset.focus();
          });
        document
          .getElementById("confirmReset")
          .addEventListener("click", function () {
            resetDialog.hidden = true;
            resetInput.value = "";
            startReset.disabled = true;
            resetStatus.textContent = "데모: 로컬 데이터 초기화됨";
            resetStatus.className = "status ok";
          });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !resetDialog.hidden) {
            resetDialog.hidden = true;
            startReset.focus();
          }
        });
      })();
    </script>
  </body>
</html>
