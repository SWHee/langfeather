[project]
name = "langfeather-workspace"
version = "0.3.1"
description = "Development workspace for LangFeather"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "langgraph>=1.2,<2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "sdk/python",
    "server",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
testpaths = [
    "sdk/python/tests",
    "server/tests",
    "tests/integration",
]

[tool.ruff]
extend-exclude = [
    ".python",
    ".uv-cache",
    ".venv",
    "web",
]
line-length = 88
src = [
    "sdk/python/src",
    "server/src",
]
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.mypy]
exclude = [
    "^\\.python/",
    "^\\.uv-cache/",
    "^\\.venv/",
]
explicit_package_bases = true
python_version = "3.10"
strict = true
warn_unreachable = true
