<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LangFeather local-first LLM execution tracing"
    />
    <link rel="icon" href="/langfeather-mark.png" />
    <title>LangFeather</title>
    <!-- 첫 paint 전에 theme을 정해 light에서 dark로 번쩍이지 않게 한다.
         bundle을 기다릴 수 없어 src/theme.ts의 해석 규칙을 여기서 한 번 더 쓴다.
         두 곳을 함께 고쳐야 한다. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("langfeather.theme");
        } catch (error) {
          /* localStorage를 쓸 수 없는 환경. OS 설정으로 시작한다. */
        }
        var dark =
          stored === "light" || stored === "dark"
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
