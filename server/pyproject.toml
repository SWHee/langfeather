[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langfeather-server"
version = "0.1.0"
description = "Local LangFeather tracing server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
langfeather-server = "langfeather_server.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langfeather_server"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "langfeather_server/_alembic"
