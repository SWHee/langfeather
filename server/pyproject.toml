[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langfeather-server"
version = "0.2.0"
description = "Local LangFeather tracing server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SungjinWi99" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/SungjinWi99/LangFeather"
Documentation = "https://github.com/SungjinWi99/LangFeather#readme"
Source = "https://github.com/SungjinWi99/LangFeather"
Issues = "https://github.com/SungjinWi99/LangFeather/issues"

[project.scripts]
langfeather-server = "langfeather_server.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langfeather_server"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "langfeather_server/_alembic"

[tool.hatch.build.targets.sdist]
include = ["src/langfeather_server", "migrations", "README.md", "LICENSE"]
