name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --all-packages --all-groups --locked
      - run: uv run ruff check examples scripts sdk/python server tests
      - run: uv run mypy -p langfeather -p langfeather_server
      - run: uv run mypy examples sdk/python/tests server/tests tests/integration scripts
      - run: make contract-check
      # SDK/server에는 같은 basename의 test module이 있다. 별도 pytest process로
      # 실행해 import-file mismatch 없이 각 package를 검증한다.
      - run: make test-sdk
      - run: make test-server
      - run: make test-integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
