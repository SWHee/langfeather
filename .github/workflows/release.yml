name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ghcr.io/sungjinwi99/langfeather

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --python 3.12 --all-packages --all-groups --locked
      - run: npm ci --prefix web
      - name: Check the release tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "${version}" = "$(uv run python -c 'import langfeather; print(langfeather.__version__)')"
      - run: uv lock --check
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make contract-check
      - run: make build
      - run: make smoke
      - run: bash scripts/container_smoke.sh

  build-sdk:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package langfeather --out-dir dist/langfeather --clear
      - uses: actions/upload-artifact@v4
        with:
          name: langfeather-sdk-${{ github.ref_name }}
          path: dist/langfeather
          if-no-files-found: error

  publish-pypi:
    needs: build-sdk
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langfeather
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: langfeather-sdk-${{ github.ref_name }}
          path: dist/langfeather
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/langfeather

  publish-container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/SungjinWi99/LangFeather
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  verify-public-artifacts:
    needs:
      - publish-pypi
      - publish-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the published SDK in a clean environment
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install "langfeather[langchain]==${version}"
      - name: Pull and start the publicly available collector image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker pull "${IMAGE_NAME}:${version}"
          docker run -d --rm --name langfeather-release-smoke \
            -p 127.0.0.1:4319:4319 \
            "${IMAGE_NAME}:${version}"
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4319/api/v1/health
      - name: Send one trace from the published SDK
        env:
          LANGFEATHER_ENDPOINT: http://127.0.0.1:4319
        run: .release-venv/bin/python scripts/sdk_dist_smoke.py
      - name: Confirm the collector stored the trace
        run: |
          curl --fail "http://127.0.0.1:4319/api/v1/traces?limit=1" \
            | grep -q 'release-package-smoke'
      - name: Stop release smoke container
        if: always()
        run: docker rm -f langfeather-release-smoke || true

  create-github-release:
    needs: verify-public-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: langfeather-sdk-${{ github.ref_name }}
          path: dist/langfeather
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/langfeather/* \
            --title "LangFeather ${GITHUB_REF_NAME#v}" --generate-notes
